name: BorderBattle
version: '${version}'
main: net.woistjojo.borderBattle.BorderBattle
api-version: '1.21.11'
load: POSTWORLD

commands:
  mod:
    description: Setzt dich als Moderator oder wieder als Spieler.
    usage: /mod
    permission: borderbattle.mod
  challenge:
    description: Startet oder stoppt die Challenge.
    usage: /challenge <start|stop>
    aliases:
      - challange
    permission: borderbattle.challenge
  border:
    description: Bewegt oder stoppt die WorldBorder.
    usage: /border <go|stop>
    permission: borderbattle.border
  glow:
    description: Gibt allen Spielern fuer die angegebene Zeit den Glow-Effekt.
    usage: /glow <sekunden>
    permission: borderbattle.glow
  schwer:
    description: Setzt die Schwierigkeit auf schwer.
    usage: /schwer
    permission: borderbattle.difficulty
  low:
    description: Setzt die Schwierigkeit auf einfach.
    usage: /low
    permission: borderbattle.difficulty
  schwerer:
    description: Erhoeht die Schwierigkeit um eine Stufe.
    usage: /schwerer
    permission: borderbattle.difficulty
  lower:
    description: Senkt die Schwierigkeit um eine Stufe.
    usage: /lower
    permission: borderbattle.difficulty

permissions:
  borderbattle.mod:
    default: op
  borderbattle.challenge:
    default: op
  borderbattle.border:
    default: op
  borderbattle.glow:
    default: op
  borderbattle.difficulty:
    default: op
